<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LearnSpace, learn something useful</title>
    <meta
      name="description"
      content="Short, practical online courses with a clear next step after every lesson. Free and paid courses, priced in INR."
    />
    <link rel="canonical" href="https://learn-space-coral.vercel.app/" />
    <meta name="theme-color" content="#2f5bd7" />
    <meta name="color-scheme" content="light" />

    <!--
      Favicons. Sized from the 500x500 source so the tab request is ~1.7 KB
      instead of 124 KB. favicon.ico carries 16/32/48 for legacy browsers and
      Windows pinned sites, which do not all accept PNG icons.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- iOS standalone / add-to-home-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LearnSpace" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LearnSpace" />
    <meta property="og:title" content="LearnSpace, learn something useful" />
    <meta
      property="og:description"
      content="Short, practical courses with a clear next step after every lesson."
    />
    <meta property="og:url" content="https://learn-space-coral.vercel.app/" />
    <meta property="og:image" content="https://learn-space-coral.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LearnSpace, learn something useful" />
    <meta
      name="twitter:description"
      content="Short, practical courses with a clear next step after every lesson."
    />
    <meta name="twitter:image" content="https://learn-space-coral.vercel.app/icon-512.png" />

    <!-- Stripe.js is fetched during checkout; warm the connection early. -->
    <link rel="preconnect" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
