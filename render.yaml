services:
  - type: web
    # Must match the existing Render service name exactly, otherwise applying
    # this file creates a second service. The public hostname carries a random
    # suffix (learnspace-api-oyiv.onrender.com) but the service name does not.
    name: learnspace-api
    runtime: node
    plan: free
    region: singapore
    # Root package.json declares npm workspaces, so install from the repo root.
    buildCommand: npm install
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; server/src/index.js already reads it.
      - key: CLIENT_ORIGIN
        # Comma-separated. Add your production Vercel domain here.
        value: https://learn-space-coral.vercel.app
      - key: PUBLIC_APP_URL
        value: https://learn-space-coral.vercel.app
      - key: CURRENCY
        value: inr

      # ── Secrets: set these in the Render dashboard, never in this file ──
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
