services:
  - type: web
    # Must match the existing Render service name exactly, otherwise applying
    # this file creates a second service. The public hostname carries a random
    # suffix (learnspace-api-oyiv.onrender.com) but the service name does not.
    name: learnspace-api
    runtime: node
    plan: free
    region: singapore
    # API only. Do NOT build the client here.
    #
    # NODE_ENV=production makes npm skip devDependencies, so Vite is not
    # installed on this service and `vite build` fails with "vite: not found".
    # The frontend is built and hosted by Vercel instead.
    #
    # --omit=dev is explicit rather than relying on NODE_ENV, and the server's
    # runtime packages are all listed under "dependencies".
    buildCommand: npm install --omit=dev
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; server/src/index.js already reads it.
      - key: CLIENT_ORIGIN
        # Comma-separated. Add your production Vercel domain here.
        value: https://learn-space-coral.vercel.app
      - key: PUBLIC_APP_URL
        value: https://learn-space-coral.vercel.app
      - key: CURRENCY
        value: inr

      # ── Secrets: set these in the Render dashboard, never in this file ──
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Account deletion requests are forwarded to this address.
      - key: ADMIN_EMAIL
        value: nikitakashyap013@gmail.com
